<svg width="850" height="210" viewBox="0 0 850 210" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    .status-dot {
      animation: pulse 2s infinite ease-in-out;
      transform-origin: 32px 36px;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.03em;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', system-ui, sans-serif;
      font-weight: 400;
    }
    .mono-text {
      font-family: 'JetBrains Mono', 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Card Background with Prose UI border -->
  <rect x="1" y="1" width="848" height="208" rx="14" fill="url(#bg-grad)" stroke="#1F2937" stroke-width="1.5" />
  
  <!-- Subtle Top Accent Line -->
  <line x1="20" y1="1" x2="830" y2="1" stroke="url(#line-grad)" stroke-width="1.5" />

  <!-- Status Pill (Origin / Prose UI style) -->
  <g transform="translate(32, 28)">
    <rect width="250" height="24" rx="12" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <circle class="status-dot" cx="12" cy="12" r="4" fill="#10B981" />
    <text x="24" y="16" fill="#A7F3D0" class="mono-text" font-weight="600" font-size="10.5">AVAILABLE FOR NEW PROJECTS</text>
  </g>

  <!-- Location Tag -->
  <g transform="translate(680, 28)">
    <text x="0" y="16" fill="#64748B" class="mono-text">AMPARO, SP · BRASIL</text>
  </g>

  <!-- Main Name Title -->
  <text x="32" y="104" fill="#F8FAFC" class="title-text" font-size="34">Murilo Fornel de Almeida</text>

  <!-- Subtitle -->
  <text x="32" y="136" fill="#94A3B8" class="sub-text" font-size="16">
    Full Stack Engineer &amp; Software Architect · Founder at <tspan fill="#38BDF8" font-weight="600">Teralis Tecnologia</tspan>
  </text>

  <!-- Divider Line -->
  <line x1="32" y1="156" x2="818" y2="156" stroke="#1F2937" stroke-width="1" />

  <!-- Technical Spec Footer Row -->
  <g transform="translate(32, 182)">
    <text x="0" y="0" fill="#64748B" class="mono-text">CORE DOMAIN:</text>
    <text x="96" y="0" fill="#CBD5E1" class="mono-text" font-weight="500">Next.js 15 · NestJS · TypeScript · Clean Architecture · Multi-Tenant SaaS</text>
  </g>
</svg>
